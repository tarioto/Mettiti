name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mettiti.xcodeproj \
            -scheme Mettiti \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Tests need a concrete simulator, and which iPhones exist depends on the runner's Xcode,
      # so pick an available one rather than naming a model: an iPhone on the newest iOS runtime
      # that meets the deployment target (runners also carry older runtimes, listed in no set order).
      - name: Test
        run: |
          set -o pipefail
          simulator=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]+(-[0-9]+)*$"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $version
              | select($version[0] >= 26)
              | .value[] | select(.name | startswith("iPhone"))
              | {udid, version: $version}]
            | sort_by(.version) | last | .udid // empty')
          if [[ -z "$simulator" ]]; then
            echo "::error::No iPhone simulator on iOS 26 or later is available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $simulator"
          xcodebuild test \
            -project Mettiti.xcodeproj \
            -scheme Mettiti \
            -configuration Debug \
            -destination "id=$simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
