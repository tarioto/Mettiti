name: Claude

# Claude works on issues and PRs, authenticated with the Claude subscription's OAuth token
# (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`). It starts when:
#   - an issue is labeled ready-for-agent: Claude implements it and pushes a claude/ branch
#   - someone with write access mentions @claude in an issue, PR, comment or review
# The action ignores mentions from users without write access, which matters on a public repo.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    # The same image and Xcode as the Build workflow, so Claude can build and run the tests.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: ready-for-agent
          claude_args: |
            --max-turns 100
            --allowedTools "Bash(xcodebuild:*),Bash(xcrun simctl:*),Bash(xcbeautify:*),Bash(jq:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "This is an iOS app built with Xcode. Build with: xcodebuild build -project Mettiti.xcodeproj -scheme Mettiti -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO. Run tests the way .github/workflows/build.yml does (pick an available iPhone simulator on iOS 26+). Make sure the build passes before you finish. If you add or move files in the Xcode project, mirror the change in project.yml, since XcodeGen regenerates the project from it."
