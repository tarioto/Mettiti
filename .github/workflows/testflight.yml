name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uploads run one at a time and are never cancelled, so a merge can't interrupt an upload
# that's already talking to App Store Connect.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        id: key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ -z "$ASC_KEY_P8" ]]; then
            echo "::warning::ASC_KEY_P8 isn't set; skipping the TestFlight upload."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Archive and upload
        if: steps.key.outputs.configured == 'true'
        env:
          ASC_KEY_PATH: ${{ steps.key.outputs.path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/testflight.sh

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
